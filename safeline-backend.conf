# 雷池站点级自定义 nginx 配置（SSE / 长连接专用）
# 放到：/data/safeline/resources/nginx/custom_params/backend_<ID>
# 该目录被 include 进站点的 location，改站点/重启不会被覆盖（custom_params 支持见 2.1.0+）。
#
# 应用：
#   docker exec safeline-tengine nginx -t
#   docker exec safeline-tengine nginx -s reload
#
# 若 nginx -t 报 "duplicate ... directive"，说明该指令在 proxy_params 里已有，删掉本文件对应行。

# 长连接保持
proxy_http_version 1.1;
proxy_set_header Connection "";

# 流式核心：不缓冲、不缓存
proxy_buffering off;
proxy_cache off;

# 长回答/长思考别被 60s 掐断
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# 不压缩 SSE，避免攒包
gzip off;
